<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebPrint — Epson L360</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Hubungkan ke file CSS terpisah -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Canvas Animasi Galaksi -->
    <canvas id="galaxy-canvas"></canvas>

    <main class="container">

        <!-- SCREEN LOGIN / AUTH -->
        <section id="pin-screen" class="card">
            <div class="auth-logo">
                <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </div>
            <h2>Akses Printer</h2>
            <p class="auth-subtitle">Silakan masukkan otorisasi.</p>
            <form id="pin-form">
                <input type="password" id="pin-input" placeholder="Password..." autofocus required>
                <button type="submit" id="pin-btn" class="btn-primary full-width">Masuk Sistem</button>
            </form>
            <p id="pin-error"></p>
        </section>

        <!-- SCREEN APLIKASI UTAMA -->
        <section id="app" class="card" style="display: none; padding: 0;">

            <!-- Header Banner -->
            <header class="header-banner">
                <h1>WebPrint <span>Epson L360</span></h1>
                <button id="logout-btn" class="btn-logout" type="button">Keluar</button>
            </header>

            <!-- Navigasi Menu Tab -->
            <div class="nav-container">
                <nav>
                    <button type="button" class="tab-btn active" data-tab="print">
                        <span class="icon">🖨️</span><span class="text">Cetak</span>
                    </button>
                    <button type="button" class="tab-btn" data-tab="scan">
                        <span class="icon">📄</span><span class="text">Scan</span>
                    </button>
                    <button type="button" class="tab-btn" data-tab="copy">
                        <span class="icon">📑</span><span class="text">Copy</span>
                    </button>
                    <button type="button" class="tab-btn" data-tab="queue">
                        <span class="icon">📋</span><span class="text">Antrean</span>
                    </button>
                </nav>
            </div>

            <!-- TAB: CETAK -->
            <section id="tab-print" class="tab-panel">
                <h3 class="section-title">Dokumen Baru</h3>
                <form id="print-form">
                    <div class="dropzone" id="dropzone" tabindex="0" role="button">
                        <svg class="dropzone-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                            </path>
                        </svg>
                        <h4 id="file-name-display">Ketuk untuk Pilih File</h4>
                        <p>PDF, JPG, PNG didukung</p>
                        <input type="file" id="print-file" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>

                    <div class="grid-2">
                        <label>Mode Warna
                            <select id="print-color">
                                <option value="monochrome">⚫ Hitam-Putih</option>
                                <option value="color">🌈 Berwarna</option>
                            </select>
                        </label>
                        <label>Jumlah Salinan
                            <input type="number" id="print-copies" value="1" min="1" max="50">
                        </label>
                    </div>
                    <div class="grid-2">
                        <label>Orientasi
                            <select id="print-orient">
                                <option value="portrait">📄 Portrait</option>
                                <option value="landscape">📝 Landscape</option>
                            </select>
                        </label>
                        <label>Ukuran Kertas
                            <select id="print-paper">
                                <option value="A4">A4 Standar</option>
                                <option value="F4">F4 (Folio)</option>
                            </select>
                        </label>
                    </div>
                    <button type="submit" id="print-submit-btn" class="btn-primary">Kirim ke Printer</button>
                </form>
            </section>

            <!-- TAB: SCAN -->
            <section id="tab-scan" class="tab-panel" style="display: none;">
                <h3 class="section-title">Pemindai Dokumen</h3>
                <form id="scan-form">
                    <div class="grid-2">
                        <label>Resolusi (DPI)
                            <select id="scan-dpi">
                                <option value="150">150 DPI - Cepat</option>
                                <option value="300" selected>300 DPI - Standar HD</option>
                            </select>
                        </label>
                        <label>Mode Scan
                            <select id="scan-mode">
                                <option value="Color">Berwarna</option>
                                <option value="Gray">Grayscale</option>
                            </select>
                        </label>
                    </div>
                    <button type="submit" id="scan-submit-btn" class="btn-primary">Mulai Memindai</button>
                </form>
            </section>

            <!-- TAB: COPY -->
            <section id="tab-copy" class="tab-panel" style="display: none;">
                <h3 class="section-title">Fotocopy Langsung</h3>
                <form id="copy-form">
                    <div class="grid-2">
                        <label>Resolusi & Warna
                            <select id="copy-dpi">
                                <option value="150">150 DPI</option>
                                <option value="300" selected>300 DPI</option>
                            </select>
                        </label>
                        <label>Mode Hasil
                            <select id="copy-color">
                                <option value="monochrome">⚫ Hitam-Putih</option>
                                <option value="color">🌈 Berwarna</option>
                            </select>
                        </label>
                    </div>
                    <label>Jumlah Salinan
                        <input type="number" id="copy-copies" value="1" min="1" max="20">
                    </label>
                    <button type="submit" id="copy-submit-btn" class="btn-primary">Proses Fotocopy</button>
                </form>
            </section>

            <!-- TAB: ANTREAN -->
            <section id="tab-queue" class="tab-panel" style="display: none;">
                <div class="queue-header">
                    <h3 class="section-title" style="margin-bottom: 0;">Status Antrean</h3>
                    <button id="refresh-queue-btn" type="button" class="btn-secondary btn-sm">Muat Ulang</button>
                </div>
                <ul id="queue-list" class="queue-list"></ul>
            </section>

        </section>
    </main>

    <!-- Hubungkan ke file JavaScript terpisah -->
    <script src="script.js"></script>
</body>

</html>
